<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:"Plus Jakarta Sans",system-ui,sans-serif;
    background:#FAF6EE;color:#1C2B21;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;text-align:center;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:480px}
  .mark{width:52px;height:52px;border-radius:14px;background:#1E3B2C;display:grid;place-items:center;margin:0 auto 28px}
  .mark svg{width:26px;height:26px;stroke:#F2E7C4;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  h1{font-family:"Fraunces",Georgia,serif;font-weight:560;font-size:clamp(64px,10vw,96px);line-height:1;letter-spacing:-.02em;color:#1E3B2C}

  p{color:#41523F;font-size:15.5px;line-height:1.7;margin:16px auto 28px;max-width:36ch}
  a{
    display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 26px;border-radius:14px;
    background:#1E3B2C;color:#F7F3E6;font-weight:700;font-size:15px;text-decoration:none;
    transition:background .18s,transform .18s;
  }
  a:hover{background:#264B38;transform:translateY(-1px)}
  a svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
